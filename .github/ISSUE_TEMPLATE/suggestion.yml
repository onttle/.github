name: Suggestion / 제안
description: An improvement to this repository, or an example you would like to see.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like / 제안 내용
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps / 필요한 이유
      description: What are you trying to build?
